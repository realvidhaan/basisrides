# Free-tier database backup + keep-alive.
#
# Why this exists: on Supabase Free there are no managed backups, and a project
# pauses after 7 days of *zero* database activity. This nightly job solves both —
# it takes a logical backup with pg_dump, and the act of connecting + reading the
# database counts as activity, so the project never pauses. Cost: $0.
#
# Setup (one time):
#   1. Supabase Dashboard -> Project Settings -> Database -> Connection string
#      (use the "Session"/direct connection URI, including the password).
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret
#      named SUPABASE_DB_URL with that URI as the value.
#
# Restore (when you need it): download the artifact, then
#   psql "$SUPABASE_DB_URL" < basisride-backup.sql

name: DB Backup

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily (~1-2am PT)
  workflow_dispatch: {} # lets you run it on demand from the Actions tab

# Never overlap two backup runs.
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # We run pg_dump from inside a pinned Postgres image so the client major
        # version matches the Supabase server (Postgres 17) — a mismatched
        # pg_dump refuses to dump a newer server. The container can reach the
        # public Supabase host directly.
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — see the setup notes at the top of this file."
            exit 1
          fi

          # Logical backup of YOUR application data — the `public` schema with
          # schema + rows. Flags explained:
          #   --schema=public     only our app tables (users, trips, messages,
          #                       availability, swaps, invite_codes, reports,
          #                       blocks…). Deliberately skips the platform-managed
          #                       auth/storage/vault/supabase_* schemas: the
          #                       connecting role can't fully read some of them
          #                       (pg_dump would error), and they're recreated by
          #                       Supabase on a fresh project anyway. Our
          #                       irreplaceable data — the community schedule and
          #                       relationships — all lives in `public`.
          #   --no-owner          don't emit "ALTER … OWNER TO" lines, so the dump
          #   --no-privileges     restores into a fresh project without depending
          #                       on Supabase's exact role names/grants.
          # We pass -e so the container inherits the secret, and mount the work dir
          # at /work so the file lands back on the runner for upload.
          docker run --rm -e SUPABASE_DB_URL -v "$PWD:/work" postgres:17-alpine \
            sh -c '
              set -e
              pg_dump "$SUPABASE_DB_URL" \
                --schema=public \
                --no-owner \
                --no-privileges \
                -f /work/basisride-backup.sql
            '

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: basisride-db-backup
          path: basisride-backup.sql
          # Retention tradeoff: GitHub artifacts expire (max 90 days). For
          # permanent history, push the dump to a private "basisride-backups"
          # repo or an object store instead. 30 days is plenty for "oops, restore
          # last night" recovery.
          retention-days: 30
          if-no-files-found: error
