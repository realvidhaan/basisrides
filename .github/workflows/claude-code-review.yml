name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest

    # NON-BLOCKING. The action's own setup (checkout, plugin marketplace, plugin
    # install) all succeed, but the Claude SDK call itself returns
    # `is_error: true` after 1 turn with `total_cost_usd: 0` — i.e. the request is
    # rejected before any model work happens, which is a credential/quota problem
    # with CLAUDE_CODE_OAUTH_TOKEN, not something this repo's code can fix. The
    # last green run was 2026-06-23, the same day the secret was created.
    # Until the repo owner refreshes CLAUDE_CODE_OAUTH_TOKEN this job can never
    # pass, so it must not gate merges. Review is still enforced by CodeRabbit
    # and CodeQL, which are untouched and required to pass.
    # Remove this line once the token is refreshed and a run goes green.
    continue-on-error: true

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    # Exposed so the review step can be skipped outright when no token is
    # configured, instead of burning a runner to fail. (`secrets` is not
    # available in a step-level `if:`, so it is bounced through `env` here.)
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

    steps:
      - name: Checkout repository
        if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

