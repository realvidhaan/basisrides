<!-- @dsCard group="Colors" viewport="700x140" name="Semantic" subtitle="Success, warning, error" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:#fff;font-family:Inter,sans-serif">
<div style="display:flex;gap:16;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:6px;width:110px">
      <div style="width:100%;height:56px;border-radius:8px;background:var(--color-success);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
      <div style="font:600 11px Inter,sans-serif;color:#1B2523">Success</div>
      <div style="font:400 10px monospace;color:#7C8C8B">#1E9E6B</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;width:110px">
      <div style="width:100%;height:56px;border-radius:8px;background:var(--color-warning);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
      <div style="font:600 11px Inter,sans-serif;color:#1B2523">Warning</div>
      <div style="font:400 10px monospace;color:#7C8C8B">#F2994A</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;width:110px">
      <div style="width:100%;height:56px;border-radius:8px;background:var(--color-error);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
      <div style="font:600 11px Inter,sans-serif;color:#1B2523">Error</div>
      <div style="font:400 10px monospace;color:#7C8C8B">#E5484D</div>
    </div></div>
</body></html>
