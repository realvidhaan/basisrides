<!-- @dsCard group="Colors" viewport="700x200" name="Neutral Colors" subtitle="Text, surface, border neutrals" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-primary); background: #fff; }
  .swatches { display: flex; gap: 0; height: 200px; }
  .swatch { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; }
  .swatch span { font-size: 11px; font-weight: 600; line-height: 1.4; }
  .label { color: #fff; }
  .label-dark { color: #1E232C; }
</style>
</head>
<body>
<div class="swatches">
  <div class="swatch" style="background:#6A707C"><span class="label">Secondary<br>#6A707C</span></div>
  <div class="swatch" style="background:#8391A1"><span class="label">Muted<br>#8391A1</span></div>
  <div class="swatch" style="background:#A0A0A0"><span class="label">Disabled<br>#A0A0A0</span></div>
  <div class="swatch" style="background:#F7F8F9; border:1px solid #eee"><span class="label-dark">Surface<br>#F7F8F9</span></div>
  <div class="swatch" style="background:#DADADA"><span class="label-dark">Border<br>#DADADA</span></div>
  <div class="swatch" style="background:#E8ECF4"><span class="label-dark">Subtle<br>#E8ECF4</span></div>
</div>
</body>
</html>
