<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing Scale" subtitle="4px base unit — 0 through 64" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-primary); background: #fff; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: #DC143C; width: 20px; border-radius: 2px; }
  .label { font-size: 10px; color: #8391A1; font-family: monospace; text-align: center; }
  .val { font-size: 10px; color: #1E232C; font-weight: 600; }
</style>
</head>
<body>
<div class="grid">
  <div class="item"><div class="bar" style="height:4px"></div><span class="val">4</span><span class="label">--space-1</span></div>
  <div class="item"><div class="bar" style="height:8px"></div><span class="val">8</span><span class="label">--space-2</span></div>
  <div class="item"><div class="bar" style="height:12px"></div><span class="val">12</span><span class="label">--space-3</span></div>
  <div class="item"><div class="bar" style="height:16px"></div><span class="val">16</span><span class="label">--space-4</span></div>
  <div class="item"><div class="bar" style="height:20px"></div><span class="val">20</span><span class="label">--space-5</span></div>
  <div class="item"><div class="bar" style="height:24px"></div><span class="val">24</span><span class="label">--space-6</span></div>
  <div class="item"><div class="bar" style="height:28px"></div><span class="val">28</span><span class="label">--space-7</span></div>
  <div class="item"><div class="bar" style="height:32px"></div><span class="val">32</span><span class="label">--space-8</span></div>
  <div class="item"><div class="bar" style="height:40px"></div><span class="val">40</span><span class="label">--space-10</span></div>
  <div class="item"><div class="bar" style="height:48px"></div><span class="val">48</span><span class="label">--space-12</span></div>
  <div class="item"><div class="bar" style="height:64px"></div><span class="val">64</span><span class="label">--space-16</span></div>
</div>
</body>
</html>
