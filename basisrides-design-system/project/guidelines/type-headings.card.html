<!-- @dsCard group="Type" viewport="700x380" name="Heading Scale" subtitle="Urbanist Bold — screen titles and wordmarks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-primary); background: #fff; color: #1E232C; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid #F0F0F0; }
  .row:last-child { border-bottom: none; }
  .meta { font-size: 11px; color: #8391A1; width: 120px; flex-shrink: 0; font-family: monospace; }
  .sample { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="row">
    <span class="meta">36px · 700</span>
    <span class="sample" style="font-size:36px;font-weight:700;letter-spacing:-0.01em;">BasisRide</span>
  </div>
  <div class="row">
    <span class="meta">30px · 700</span>
    <span class="sample" style="font-size:30px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;">Welcome back to BasisRides</span>
  </div>
  <div class="row">
    <span class="meta">26px · 700</span>
    <span class="sample" style="font-size:26px;font-weight:700;">Create your account</span>
  </div>
  <div class="row">
    <span class="meta">20px · 700</span>
    <span class="sample" style="font-size:20px;font-weight:700;">OTP Verification</span>
  </div>
</body>
</html>
