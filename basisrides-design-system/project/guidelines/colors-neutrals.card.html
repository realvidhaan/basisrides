<!-- @dsCard group="Colors" viewport="700x140" name="Neutrals" subtitle="Ink, secondary text, muted, surfaces" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:#fff;font-family:Inter,sans-serif">
<div style="display:flex;gap:16;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:6px;width:110px">
      <div style="width:100%;height:56px;border-radius:8px;background:var(--color-ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
      <div style="font:600 11px Inter,sans-serif;color:#1B2523">Ink</div>
      <div style="font:400 10px monospace;color:#7C8C8B">#1B2523</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;width:110px">
      <div style="width:100%;height:56px;border-radius:8px;background:var(--color-ink-secondary);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
      <div style="font:600 11px Inter,sans-serif;color:#1B2523">Ink secondary</div>
      <div style="font:400 10px monospace;color:#7C8C8B">#55635F</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;width:110px">
      <div style="width:100%;height:56px;border-radius:8px;background:var(--color-text-muted);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
      <div style="font:600 11px Inter,sans-serif;color:#1B2523">Text muted</div>
      <div style="font:400 10px monospace;color:#7C8C8B">#7C8C8B</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;width:110px">
      <div style="width:100%;height:56px;border-radius:8px;background:var(--color-surface-white);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
      <div style="font:600 11px Inter,sans-serif;color:#1B2523">Surface white</div>
      <div style="font:400 10px monospace;color:#7C8C8B">#FFFFFF</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;width:110px">
      <div style="width:100%;height:56px;border-radius:8px;background:var(--color-surface-subtle);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
      <div style="font:600 11px Inter,sans-serif;color:#1B2523">Surface subtle</div>
      <div style="font:400 10px monospace;color:#7C8C8B">#F4F9F9</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;width:110px">
      <div style="width:100%;height:56px;border-radius:8px;background:var(--color-border-default);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
      <div style="font:600 11px Inter,sans-serif;color:#1B2523">Border default</div>
      <div style="font:400 10px monospace;color:#7C8C8B">#D8E4E3</div>
    </div></div>
</body></html>
