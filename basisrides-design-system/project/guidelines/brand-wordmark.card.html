<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 32px; font-family: var(--font-primary); background: #fff; display: flex; align-items: center; gap: 48px; }
  .wordmark { font-size: 36px; font-weight: 700; color: #DC143C; letter-spacing: -0.5px; }
  .sub { font-size: 15px; color: #6B6B6B; font-weight: 400; }
  .divider { width: 1px; height: 60px; background: #E8ECF4; }
  .tagline { font-size: 15px; color: #8391A1; font-weight: 500; font-style: italic; }
</style>
</head>
<body>
  <div>
    <div class="wordmark">Ridr</div>
    <div class="sub">Carpool for BISV families</div>
  </div>
  <div class="divider"></div>
  <div class="tagline">"Carpool for BISV families"<br><span style="color:#1E232C;font-style:normal;font-size:12px;font-family:monospace;">Urbanist 700 · #DC143C · -0.5px tracking</span></div>
</body>
</html>
