<!-- @dsCard group="Components" viewport="700x160" name="Card" subtitle="Bordered vs borderless" -->
<!doctype html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script></head>
<body style="margin:0;padding:24px;background:#F4F9F9">
<div id="root"></div>
<script type="text/babel">
const { Card } = window.RidrDesignSystem || {};
function Demo(){
  return (
    <div style={{display:'flex',gap:16}}>
      <div style={{width:260}}><Card><div style={{fontWeight:700,marginBottom:6}}>Morning carpool</div><div style={{fontSize:13,color:'#7C8C8B'}}>7:45am · 3 seats open</div></Card></div>
      <div style={{width:260}}><Card bordered={false}><div style={{fontWeight:700,marginBottom:6}}>No border</div><div style={{fontSize:13,color:'#7C8C8B'}}>Borderless variant</div></Card></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
