<!doctype html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script></head>
<body style="margin:0;padding:0;background:#F4F9F9">
<div id="root" style="position:relative;height:260px;overflow:hidden"></div>
<script type="text/babel">
const { Modal, Button } = window.RidrDesignSystem || {};
function Demo(){
  return (
    <div style={{position:'absolute',inset:0}}>
      <Modal open={true} title="Cancel this ride?" footer={<><div style={{flex:1}}><Button label="Keep ride" variant="outline"/></div><div style={{flex:1}}><Button label="Cancel it" variant="primary"/></div></>}>
        This will notify the other riders in your carpool.
      </Modal>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
